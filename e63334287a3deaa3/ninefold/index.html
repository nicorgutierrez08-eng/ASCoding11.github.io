<style>
/* Ninefold: the daily sudoku. Same dark navy look, fonts, top bar, pills and modals as Deepword and the daily geography games. */
:root{

}
*{box-sizing:border-box}

<script>
'use strict';
(function () {
const SLUG = 'ninefold', NAME = 'Ninefold', LAUNCH = '20261101', SU = window.Sudoku;
const LEVELS = SU.LEVELS, LVNAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
const $ = (id) => document.getElementById(id);
function h(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  if (kids) for (const c of kids) if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// ------------------------------------------------------------------ days (the player's local date; 2026-11-01 is #1)
let DAY_TEST = (navigator.webdriver && /^\d{8}$/.test(window.__NF_TODAY || '')) ? window.__NF_TODAY : ''; // tests only
const keyOf = (d) => String(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
const today = () => DAY_TEST || keyOf(new Date());
const dateOf = (k) => new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8), 12);
function addDays(k, n) { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
const dayNum = (k) => Math.round((dateOf(k) - dateOf(LAUNCH)) / 864e5) + 1;
const dailySeed = (k) => 'ninefold-' + k;
function fmtTime(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), x = s % 60; return m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ':' + String(x).padStart(2, '0') : m + ':' + String(x).padStart(2, '0'); }
function countdown() {
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), s = Math.max(0, Math.floor((m - n) / 1000));
  const p = (x) => (x < 10 ? '0' : '') + x;
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
}

// ------------------------------------------------------------------ the daily:ninefold record (read by the Daily hub)
// A day counts as played once you put a number in any of that day's three puzzles, and as won once you finish one.
// days[k].lv holds the seconds for each level finished that day; score = how many of the three you finished.
const Daily = {
  blank: () => ({ v: 1, days: {}, played: 0, wins: 0, streak: 0, maxStreak: 0, last: '', dist: {} }),
  load() {
    let o = store.get('daily:' + SLUG, null);
    if (!o || typeof o !== 'object' || o.v !== 1) o = Daily.blank();
    ['played', 'wins', 'streak', 'maxStreak'].forEach((f) => { o[f] = Math.max(0, +o[f] || 0); });
    if (!o.days || typeof o.days !== 'object') o.days = {};
    if (!o.dist || typeof o.dist !== 'object') o.dist = {};
    const t = today(), y = addDays(t, -1);
    if (o.streak && o.last !== t && o.last !== y) { o.streak = 0; store.set('daily:' + SLUG, o); }
    return o;
  },
  trim(o) { const cut = addDays(today(), -59); Object.keys(o.days).forEach((d) => { if (d < cut) delete o.days[d]; }); },
  begin(k) {
    const o = Daily.load();
    if (o.days[k]) return o;
    o.days[k] = { done: false, win: false, score: null, tries: null, time: null };
    o.played++; Daily.trim(o); store.set('daily:' + SLUG, o);
    return o;
  },
  solved(k, lv, secs, hints) {
    let o = Daily.begin(k);
    const d = o.days[k];
    d.lv = d.lv && typeof d.lv === 'object' ? d.lv : {};
    if (lv in d.lv) return o;
    const before = Object.keys(d.lv).length;
    d.lv[lv] = Math.round(secs);
    d.hints = (d.hints || 0) + hints;
    const n = before + 1;
    if (!d.done) {
      d.done = true; d.win = true; o.wins++;
      const prev = o.days[addDays(k, -1)];
      o.streak = (prev && prev.win && o.streak > 0 && (o.last === addDays(k, -1) || o.last === k)) ? o.streak + 1 : 1;
      o.maxStreak = Math.max(o.maxStreak, o.streak);
      if (!o.last || k > o.last) o.last = k;
    }
    if (before) o.dist[before] = Math.max(0, (o.dist[before] || 0) - 1);
    o.dist[n] = (o.dist[n] || 0) + 1;
    d.score = n; d.tries = d.hints; d.time = Object.keys(d.lv).reduce((a, x) => a + d.lv[x], 0);
    Daily.trim(o); store.set('daily:' + SLUG, o);
    try { if (window.BackRoomStats) { BackRoomStats.add('wins', 1); if (o.streak > 0) BackRoomStats.max('streak', o.streak); } } catch (e) {}
    return o;

}
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]); }
function showHint(title, items, view) {

function closeHint() { const box = $('hintBox'); if (!box.hidden) { box.hidden = true; hintView = null; if (st) render(); } }

// ------------------------------------------------------------------ the end of a puzzle
function checkDone() {

  tick();

  st.done = true;
  const best = recordLevel(st.lv, st.t, st.hints);

}
function shareText() {
  const day = today(), rec = dayRec(day), n = dayNum(day);

  }

  const prog = {}; LEVELS.forEach((l) => { prog[l] = store.get(progKey('daily', l), null); });
  const lines = LEVELS.map((l) => {

    const hints = prog[l] && prog[l].day === day ? prog[l].hints : 0;
    return (hints ? '🟨 ' : '🟩 ') + LVNAME[l] + ' ' + fmtTime(rec[l]) + (hints ? ' 💡' + hints : '');

}
function share() { const t = shareText(); if (!t) return; copyText(t).then((ok) => toast(ok ? 'Copied! Paste it anywhere.' : 'Couldn\'t copy, sorry')); }
function endCard() {
  const box = $('endBox'); box.innerHTML = ''; box.className = 'end';
  const L = lvStats()[st.lv], rec = st.mode === 'daily' ? dayRec(st.day) || {} : {};

    h('div', { class: 'row' }, [
      h('button', { type: 'button', class: 'cta', text: 'Share', onclick: share }),
      left.length ? h('button', { type: 'button', class: 'ghost', text: 'Play ' + LVNAME[left[0]], onclick: () => setLevel(left[0]) }) : null,
      h('button', { type: 'button', class: 'ghost', text: st.mode === 'daily' ? 'Unlimited' : 'New puzzle', onclick: () => { if (st.mode === 'daily') setMode('free'); else newFree(); } }),
      st.mode === 'daily' && !left.length ? h('span', { class: 'next', id: 'nextIn', text: 'Next in ' + countdown() }) : null]));

// ------------------------------------------------------------------ drawing
function render() {
  if (!st) return;
  bD.classList.toggle('on', mode === 'daily'); bU.classList.toggle('on', mode === 'free');
  bD.setAttribute('aria-pressed', mode === 'daily'); bU.setAttribute('aria-pressed', mode === 'free');
  const rec = mode === 'daily' ? dayRec(today()) || {} : {};
  LEVELS.forEach((l) => {
    const b = lvBtns[l]; b.classList.toggle('on', l === level); b.setAttribute('aria-pressed', l === level);
    b.innerHTML = LVNAME[l] + (rec[l] != null ? '<span class="ok" aria-label="finished">✓</span>' : '');
  });

  metaEl.hidden = mode === 'free' && !st.done;
  metaEl.innerHTML = st.done ? '' : (st.hints ? '💡 <b>' + st.hints + '</b>' : '') + (settings.check && st.miss ? (st.hints ? ' · ' : '') + '❌ <b>' + st.miss + '</b>' : '');

  const sr = sel >= 0 ? Math.floor(sel / 9) : -1, sc = sel >= 0 ? sel % 9 : -1, sb = sel >= 0 ? SU.boxOf(sel) : -1;
  const pat = hintView ? hintView.cells : [], unitCells = {};

  const counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = st.v[i], given = st.given[i];
    if (v) counts[v]++;
    const peer = settings.peers && sel >= 0 && i !== sel && (Math.floor(i / 9) === sr || i % 9 === sc || SU.boxOf(i) === sb);
    const bad = v && !given && settings.check && v !== st.sol[i];
    el.classList.toggle('g', given);
    el.classList.toggle('sel', i === sel);
    el.classList.toggle('peer', !!peer && !st.done);
    el.classList.toggle('same', settings.same && !!fd && v === fd && i !== sel && !st.done);
    el.classList.toggle('bad', !!bad);
    el.classList.toggle('hinted', !!st.hi[i] && !bad);

  $('pad').classList.toggle('notes', notesMode);
  tNotes.classList.toggle('on', notesMode); tNotes.setAttribute('aria-pressed', notesMode); tNotes.querySelector('.badge').textContent = notesMode ? 'ON' : 'OFF';

}

// ------------------------------------------------------------------ keyboard
document.addEventListener('keydown', (e) => {
