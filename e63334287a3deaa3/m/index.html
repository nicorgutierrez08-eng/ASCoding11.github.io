<style>
/* The phone version of the Back Room: every game as a tile, opened full screen with a bar to come back.
   It can be added to the home screen, where it runs like an app. */
:root{
  --bg:#15122a;
  --panel:#201c3b;
  --line:rgba(255,248,232,.12);
  --ink:#fff8e8;
  --ink-2:#b9b2d4;
  --accent:#ffc93c;
  --f-d:'Big Shoulders Display','Arial Narrow',system-ui,sans-serif;
  --f-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-d);font-weight:800;font-size:44px;line-height:.9;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.count{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 0}
.full{font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.tip b{color:var(--ink)}
.tip button{margin-left:auto;flex:0 0 auto;background:none;border:0;color:var(--ink-2);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}
.cont{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(90deg,rgba(255,201,60,.18),rgba(255,201,60,.04));border:1px solid rgba(255,201,60,.35);border-radius:14px;padding:10px;margin-bottom:22px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cont img{width:84px;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:8px;flex:0 0 auto}
.cont small{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cont strong{display:block;font-family:var(--f-d);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05}
.cont .go{margin-left:auto;font-size:22px;color:var(--accent);padding-right:6px}
h2{font-family:var(--f-m);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 10px}
.mode{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:30px 0 2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mode h2{font-family:var(--f-d);font-weight:800;font-size:32px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0;color:var(--ink)}
.mode.multi h2{color:var(--accent)}.mode.solo h2{color:#8fd3ff}.mode.puzzles h2{color:#b7a8ff}.mode.parkour h2{color:#6cc8ff}.mode.action h2{color:#ff8a94}
.mode p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.mode .n{flex:none;font-family:var(--f-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
#lists h3{font-family:var(--f-m);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 10px}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:30px;padding:14px;border-radius:14px;border:1px dashed rgba(255,201,60,.45);background:linear-gradient(115deg,rgba(255,201,60,.14),rgba(143,211,255,.08))}
.ask p{margin:0;flex:1 1 220px;font-size:14px;line-height:1.45;color:var(--ink-2)}.ask b{color:var(--ink)}
.ask button{flex:1 1 auto;min-height:44px;padding:8px 18px;border-radius:999px;border:0;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;font:inherit;text-align:left;padding:0;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:#0d0b1c}
.tile .t{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile strong{font-family:var(--f-d);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.tile span{font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.tile em{margin-top:auto;padding-top:5px;font-style:normal;font-family:var(--f-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
footer{margin-top:30px;font-size:12px;color:var(--ink-2);text-align:center}
footer a{color:var(--ink-2)}

/* A game fills the screen under a thin bar with the way back. */
#play{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#000}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:calc(34px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
#back{font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
#name{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turn{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--ink-2);white-space:nowrap}
@media (orientation:landscape){#turn{display:none}}
#frame{flex:1;width:100%;border:0;display:block;background:#000}
body.playing{overflow:hidden}
/* Party panel (party.js): the colours and button styles it borrows from site.css on the computer version. */
:root{--panel-2:#2a2550;--accent-ink:#15122a;--down:#ff8a7a;--mono:var(--f-m);--body:var(--f-b)}
body #party{padding-top:0;margin-bottom:18px}
body .pty h2{font-family:var(--f-d);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.pty .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--f-b);font-size:15px}
.pty .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header>
    <div>
      <h1>Arjun's <span>games</span></h1>
      <p class="count" id="count"></p>
    </div>
    <a class="full" href="/" target="_top">Main site</a>
  </header>
  <div class="tip" id="tip" hidden><span id="tipText"></span><button type="button" id="tipX" aria-label="Hide tip">×</button></div>
  <button class="cont" id="cont" type="button" hidden></button>
  <div id="lists"></div>
  <footer>Every game works with touch: sticks, buttons and drag to look appear when you play. <br>© 2026 Arjun · <a href="/privacy.html" target="_blank" rel="noopener">Privacy policy</a></footer>
</div>

<div id="play" hidden>
  <div id="bar"><button id="back" type="button">‹ Games</button><span id="name"></span><span id="turn">Turn sideways ↻</span></div>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

<script>
(function(){
  // land: plays best with the phone turned sideways
  var B='/e63334287a3deaa3/';
  // Each group: [kind, games, mode]. mode puts it under one of the five headings in MODES, in this order (the same
  // sections as the computer version): keep groups of one mode together. A game goes where it fits best, so an online
  // puzzle game is under Puzzles and an online shooter under Shooter / Action; Multiplayer has the other online games.
  // A game: [folder, name, one line, best sideways (1/0), and its address if it lives outside the Back Room folder].
  // daily (Daily Puzzles) is the dashboard for every daily puzzle; the daily games open from it inside the same frame.
  var MODES={puzzles:['Puzzles','Daily puzzles, word games, trivia and numbers.'],parkour:['Parkour','Obbies, towers and climbs.'],action:['Shooter / Action','Shoot, hide, build and wreck.'],multi:['Multiplayer','Play online with friends, or against bots.'],solo:['Single player','Drop-and-stack games for one.']};
  var GROUPS=[
    ['Every day',[
      ['daily','Daily Puzzles','22 puzzles a day: word, geography, logic and soccer, with your streak.',0]
    ],'puzzles'],
    ['Words and trivia',[
      ['deepword','Deepword','Find the answer nobody else thought of and dive deeper.',0],
      ['puffer-party','Puffer Party','Name something in the category before the pufferfish pops.',0],
      ['trivium','Trivium','Trivia: a daily ten, quick play or a live contest.',0],
      ['boxed','Boxed','Real AMC 10 and AIME problems, five a day.',0,'/boxed/']
    ],'puzzles'],
    ['Number and block puzzles',[
      ['gridpop','Gridpop','Drop blocks on an 8 × 8 grid and pop full rows and columns.',0],
      ['2048','2048','Join tiles to 2048: Classic, 6 × 6 Mega, or College and Dessert ladders.',0]
    ],'puzzles'],
    ['Obbies and climbs',[
      ['spire','Spire','Race up a random tower. Every landing saves your place, so mind the red.',1],
      ['turbo-trail','Turbo Trail','A speedrun obby: 25 quick levels, medals, splits and online races.',1],
      ['escapade','Escapade','Parkour out of eight escape rooms. Find the key, crack the code.',1],
      ['updraft','Updraft','Climb a thousand metres of junk, clouds and sky. Miss a jump and you fall.',1],
      ['tumble-trials','Tumble Trials','A wobbly knockout show for up to 16. Last bean standing wins.',1]
    ],'parkour'],
    ['Shoot and hide',[
      ['shell-crackers','Shell Crackers','First-person egg shooter. Crack the most shells before the clock runs out.',1],
      ['backrooms-1v1','Backrooms 1v1–4v4','Red vs Blue in Level 0. Build cover and wipe out the other team.',1],
      ['chromaflage','Chromaflage','Paint yourself to match the room, then hide. Or hunt the painted.',1],
      ['odd-one-out','Odd One Out','Props vs Hunters: turn into anything in the room, or shoot what doesn\'t belong.',1]
    ],'action'],
    ['Battle',[
      ['rumble-karts','Rumble Karts','Three-minute kart brawls with weapons.',1]
    ],'action'],
    ['Racing and sports',[
      ['slipstream','Slipstream','22-car open-wheel races. Draft, brake late, pass.',1],
      ['boostball','Boostball','Rocket-car soccer with a giant ball.',1]
    ],'multi'],
    ['Arenas, cards and markets',[
      ['coil','Coil','Grow your snake and cut off the bigger ones.',0],
      ['showdown','Showdown','No-limit Hold\'em with friends or bots.',0],
      ['hype-cycle-exchange','Hype Cycle Exchange','A stock market game: trade the rumors, beat the index.',0,'/hype-cycle-exchange/']
    ],'multi'],
    ['Drop and stack',[
      ['stackfall','Stackfall','Falling blocks: clear rows, or link sand wall to wall.',0],
      ['melon-merge','Melon Merge','Drop fruit, merge twins, grow a watermelon.',0]
    ],'solo']
  ];
  var byId={},total=0;
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var $=function(id){return document.getElementById(id)};

  function tile(g){
    var b=document.createElement('button');b.type='button';b.className='tile';
    var img=document.createElement('img');img.src='thumbs/'+g.id+'.jpg';img.alt='';img.loading='lazy';img.width=560;img.height=350;
    var t=document.createElement('div');t.className='t';
    var n=document.createElement('strong');n.textContent=g.name;
    var d=document.createElement('span');d.textContent=g.desc;
    t.append(n,d);
    if(g.land){var e=document.createElement('em');e.textContent='↻ Best sideways';t.append(e)}
    b.append(img,t);b.addEventListener('click',function(){openGame(g)});
    return b;
  }
  var mode='',modeN=null,modeCount=0;
  GROUPS.forEach(function(gr){
    if(gr[2]!==mode){
      mode=gr[2];modeCount=0;var M=MODES[mode]||[mode,''];
      var mh=document.createElement('div');mh.className='mode '+mode;
      var mt=document.createElement('div');var h=document.createElement('h2');h.textContent=M[0];var mp=document.createElement('p');mp.textContent=M[1];mt.append(h,mp);
      modeN=document.createElement('span');modeN.className='n';
      mh.append(mt,modeN);$('lists').append(mh);
    }
    var k=document.createElement('h3');k.textContent=gr[0];
    var grid=document.createElement('div');grid.className='grid';
    gr[1].forEach(function(r){var g={id:r[0],name:r[1],desc:r[2],land:!!r[3],url:r[4]||B+r[0]+'/'};if(g.id==='daily')g.scope=B;byId[g.id]=g;if(g.id!=='daily'){total++;modeCount++}grid.append(tile(g))});
    modeN.textContent=modeCount+(modeCount===1?' game':' games')+(mode==='puzzles'?' + daily':'');
    $('lists').append(k,grid);
  });
  $('count').textContent=total+' games · made for touch';
  // Under the games: ask for ideas through the feedback bar at the top (feedback.js opens it for data-feedback-open).
  var ask=document.createElement('div');ask.className='ask';
  var at=document.createElement('p');var ab=document.createElement('b');ab.textContent='Want more games, or have an idea?';
  at.append(ab,' Tell Arjun with the feedback bar at the top of the page.');
  var abtn=document.createElement('button');abtn.type='button';abtn.setAttribute('data-feedback-open','');abtn.textContent='Tell Arjun ↑';
  ask.append(at,abtn);$('lists').append(ask);

  function showContinue(){
    var g=byId[store.get('m:last')],c=$('cont');
    if(!g){c.hidden=true;return}
    c.innerHTML='';
    var img=document.createElement('img');img.src='thumbs/'+g.id+'.jpg';img.alt='';
    var t=document.createElement('div');var s=document.createElement('small');s.textContent='Keep playing';var n=document.createElement('strong');n.textContent=g.name;t.append(s,n);
    var go=document.createElement('span');go.className='go';go.textContent='▶';
    c.append(img,t,go);c.onclick=function(){openGame(g)};c.hidden=false;
  }
  showContinue();

  // On a phone that isn't running this as a home-screen app yet, say how to add it.
  // Opened from the home page's code it runs inside that page, where adding to the home screen would save the home page instead.
  var framed=window.top!==window;
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(!standalone&&!framed&&store.get('m:tipHidden')!=='1'&&matchMedia('(pointer: coarse)').matches){
    var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    $('tipText').innerHTML=ios?'<b>Add this to your home screen</b> to open the games like an app: tap Share, then <b>Add to Home Screen</b>.':'<b>Add this to your home screen</b> to open the games like an app: open the browser menu, then <b>Add to Home screen</b> or <b>Install app</b>.';
    $('tip').hidden=false;
  }
  $('tipX').onclick=function(){$('tip').hidden=true;store.set('m:tipHidden','1')};

  // Open a game full screen. Android browsers also hide their own bars and turn sideways games sideways.
  var cur=null;
  function openGame(g){
    if(cur)return;cur=g;store.set('m:last',g.id);
    $('name').textContent=g.name;$('turn').hidden=!g.land;
    $('frame').src=g.url+(g.hash||'');$('play').hidden=false;document.body.classList.add('playing');
    history.pushState({g:g.id},'',location.href);
    var el=document.documentElement;
    if(!standalone&&el.requestFullscreen&&!/iPhone|iPad|iPod/.test(navigator.userAgent)&&matchMedia('(pointer: coarse)').matches){
      el.requestFullscreen({navigationUI:'hide'}).then(function(){
        if(g.land&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});
      }).catch(function(){});
    }
  }
  function closeGame(){
    if(!cur)return;cur=null;
    $('play').hidden=true;$('frame').src='about:blank';document.body.classList.remove('playing');
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
    showContinue();
  }
  $('back').onclick=function(){history.back()};

  // An invite link (#<room>) opens its game straight away. Room codes start with the game's prefix; any other code is a Rumble Karts room.
  var PREFIX={tv:'trivium',br:'backrooms-1v1',sc:'shell-crackers',hm:'hail-mary',cl:'coil',ss:'slipstream',bb:'boostball',qy:'quarry',kw:'kartwheel',sd:'showdown',cf:'chromaflage',tw:'spire',up:'updraft',ph:'odd-one-out',ko:'tumble-trials',dw:'deepword',sr:'turbo-trail',er:'escapade',pf:'puffer-party'};
  // Party invites (#pt-<code>) don't open a game: they join the party in the Party panel below.
  var inv=/^#([a-z0-9-]{1,20})$/.exec(location.hash),party='';
  if(inv){
    history.replaceState(null,'',location.pathname);
    var pre=/^([a-z]{2})-/.exec(inv[1]),g=byId[pre&&PREFIX[pre[1]]||'rumble-karts'];
    if(pre&&pre[1]==='pt')party=inv[1].slice(3);
    else if(g)openGame({id:g.id,name:g.name,land:g.land,url:g.url,scope:g.scope,hash:'#'+inv[1]});
  }
  addEventListener('popstate',function(){closeGame()});

  // Parties: the same party.js as the computer version, opening games through openGame here.
  window.BackRoom={
    openGame:function(path,name){
      var m=/\/([a-z0-9-]+)\/(#[a-z0-9-]*)?$/.exec(path),g=m&&byId[m[1]];if(!g||cur)return null;
      openGame({id:g.id,name:g.name,land:g.land,url:g.url,scope:g.scope,hash:m[2]||''});return $('frame');
    },
    isOpen:function(){return !!cur},
    invite:party
  };
  var ps=document.createElement('script');ps.src=B+'party.js';document.body.appendChild(ps);
  // Online (social.js): who else is here, private messages, invites and the cabin chat, under the Party panel.
  var os=document.createElement('script');os.src=B+'social.js';document.body.appendChild(os);

  // Links that leave the game (back to the main site, other pages) close the game instead of loading inside it.
  // The Daily Puzzles page (scope: the Back Room folder) may open its games in the frame; the Back Room page itself still closes it.
  function inside(p){return cur.scope?p.indexOf(cur.scope)===0&&p!==cur.scope:p.indexOf(cur.url)===0}
  $('frame').addEventListener('load',function(){
    if(!cur)return;
    try{
      var w=$('frame').contentWindow;
      if(!inside(w.location.pathname)){history.back();return}
      w.document.addEventListener('click',function(e){
        var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.target==='_blank')return;
        var u=new URL(a.href,w.location.href);if(u.origin!==location.origin)return;
        // inside the Daily Puzzles scope, step without adding history, so ‹ Games (history.back) still closes the frame
        if(inside(u.pathname)){if(cur.scope&&!u.hash){e.preventDefault();w.location.replace(u.href)}return}
        e.preventDefault();
        if(u.pathname==='/privacy.html')window.open(u.href,'_blank','noopener');else history.back();
      },true);
      w.focus();
    }catch(e){}
  });
})();
</script>
