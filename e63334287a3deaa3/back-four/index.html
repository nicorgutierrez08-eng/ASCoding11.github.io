<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Back Four</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<script src="/e63334287a3deaa3/stats.js" data-game="back-four" defer></script>
<link rel="stylesheet" href="../football-data/kit.css">
<style>
/* Sixteen name tiles in a 4x4 grid; solved groups become coloured bars above them. */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{min-height:68px;border-radius:12px;border:0;background:#1d3156;color:var(--ink);font:800 13px/1.15 var(--f-u);padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;hyphens:auto;transition:transform .1s,background .15s}
.tile:active{transform:scale(.96)}
.tile.on{background:#e9f1ff;color:#0b1b33}
.tile.long{font-size:11.5px}
.solved{display:grid;gap:7px;margin-bottom:7px}
.grp{border-radius:12px;padding:10px 12px;text-align:center;color:#0b1b33;animation:fbpop .4s cubic-bezier(.2,1.4,.4,1)}
.grp b{display:block;font:700 16px/1.2 var(--f-d)}
.grp span{display:block;margin-top:3px;font:700 13px/1.3 var(--f-u)}
.g0{background:#ffd166}.g1{background:#5ef08f}.g2{background:#7fb8ff}.g3{background:#c9a6ff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.dots{display:flex;align-items:center;gap:6px;font:800 13px var(--f-u);color:var(--ink-3)}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--ink-2)}
.dots i.used{background:rgba(255,255,255,.12)}
.acts{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tiles.shake{animation:fbshake .35s}
@media (max-width:380px){.tile{font-size:12px;min-height:62px}.tile.long{font-size:10.5px}}
@media (max-height:460px) and (orientation:landscape){.tile{min-height:46px}.grp{padding:6px 10px}.grp b{font-size:14px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="modes" id="modes"><button type="button" data-m="daily" class="on">Daily</button><button type="button" data-m="unl">Unlimited</button></div>
  <div class="meta" id="meta"></div>
  <section class="card" id="board">
    <p class="muted center" style="margin:0 0 10px;font-weight:700">Make four groups of four with a football link.</p>
    <div class="solved" id="solved"></div>
    <div class="tiles" id="tiles"></div>
    <div class="bar"><div class="dots" id="dots"></div></div>
    <div class="acts" id="acts"><button class="ghost" id="shuf" type="button">Shuffle</button><button class="ghost" id="desel" type="button">Deselect</button><button class="cta" id="sub" type="button" disabled>Submit</button></div>
  </section>
  <section class="card result" id="res" hidden></section>
</main>
<script src="../football-data/players.js"></script>
<script src="../football-data/kit.js"></script>
<script src="../football-data/cats.js"></script>
<script src="puzzles.js"></script>
<script>
(function(){
'use strict';
const K=window.FBK,C=window.FBCAT,$=K.$,esc=K.esc,SLUG='back-four',MIST=4;
const PZ=window.FB_BACKFOUR||[];
const EM=['🟨','🟩','🟦','🟪'];
K.setup({slug:SLUG,name:'Back Four',kicker:'Find the four links',distKeys:['0','1','2','3','X'],distLabel:'Mistakes',distName:k=>k==='X'?'✗':k,
  how:'<ul><li>Sixteen players hide <b>four groups of four</b>. Each group shares a football link: the same country, a club they all played for, a league they played in, a World Cup they won, the year they were born and so on.</li><li>Select four names and press <b>Submit</b>. If you\'re one name away you\'ll be told.</li><li>You can make <b>'+(MIST-1)+' mistakes</b>; the '+MIST+'th ends the game. Colours go from easiest 🟨 to trickiest 🟪.</li><li>Links come from this game\'s own player list (as of 2025) and each name fits exactly one of the four links in it.</li><li>One puzzle a day for everyone; <b>Unlimited</b> plays random puzzles that don\'t touch your stats.</li></ul>',
  shareText:()=>shareText()});
let mode='daily',S=null;
const dayKeyS=()=>SLUG+':day:'+K.today();
function newState(i,seed){const names=[];PZ[i].forEach(g=>g[1].forEach(n=>names.push(n)));return{i,order:K.shuffle(names,K.rng(seed)),sel:[],solved:[],hist:[],mist:0,done:false,win:false}}
function load(){
  if(mode==='daily'){const i=K.dailyIndex(PZ.length,SLUG),sv=K.store.get(dayKeyS(),null);S=sv&&sv.i===i?sv:newState(i,K.hash(K.today()))}
  else{const sv=K.store.get(SLUG+':unlcur',null);S=sv&&!sv.done&&PZ[sv.i]?sv:newState(Math.floor(Math.random()*PZ.length),Math.floor(Math.random()*1e9))}
  render();
}
function save(){K.store.set(mode==='daily'?dayKeyS():SLUG+':unlcur',S)}
const groupOf=n=>PZ[S.i].findIndex(g=>g[1].indexOf(n)>=0);
function render(){
  $('meta').innerHTML=mode==='daily'?'<span><b>●</b> Daily '+esc(K.label())+'</span><span>'+esc(K.dateText())+'</span>':'<span><b>●</b> Unlimited</span><span>Streak '+K.unlimited().streak+'</span>';
  const P=PZ[S.i],show=S.done?[0,1,2,3].sort((a,b)=>{const ia=S.solved.indexOf(a),ib=S.solved.indexOf(b);return (ia<0?9+a:ia)-(ib<0?9+b:ib)}):S.solved;
  $('solved').innerHTML=show.map(g=>'<div class="grp g'+g+'"><b>'+esc(C.long(P[g][0]))+'</b><span>'+P[g][1].map(esc).join(', ')+'</span></div>').join('');
  const left=S.done?[]:S.order.filter(n=>S.solved.indexOf(groupOf(n))<0);
  $('tiles').innerHTML=left.map(n=>'<button type="button" class="tile'+(S.sel.indexOf(n)>=0?' on':'')+(n.length>15?' long':'')+'" aria-pressed="'+(S.sel.indexOf(n)>=0)+'">'+esc(n)+'</button>').join('');
  $('dots').innerHTML='Mistakes left '+[0,1,2,3].map(i=>'<i class="'+(i<S.mist?'used':'')+'"></i>').join('');
  $('acts').hidden=S.done;$('dots').parentNode.hidden=S.done;
  $('sub').disabled=S.sel.length!==4;$('desel').disabled=!S.sel.length;
  $('res').hidden=!S.done;if(S.done)showResult();
}
$('tiles').addEventListener('click',e=>{
  const b=e.target.closest('.tile');if(!b||S.done)return;const n=b.textContent,i=S.sel.indexOf(n);
  if(i>=0)S.sel.splice(i,1);else if(S.sel.length<4)S.sel.push(n);
  save();render();
});
$('shuf').addEventListener('click',()=>{K.shuffle(S.order);save();render()});
$('desel').addEventListener('click',()=>{S.sel=[];save();render()});
$('sub').addEventListener('click',submit);
function submit(){
  if(S.sel.length!==4||S.done)return;
  const gs=S.sel.map(groupOf),key=S.sel.slice().sort().join('|');
  if(S.hist.some(h=>h.k===key)){K.toast('You already tried that four.');return}
  S.hist.push({k:key,g:gs});
  const cnt={};gs.forEach(g=>cnt[g]=(cnt[g]||0)+1);const top=Math.max.apply(null,Object.values(cnt));
  if(top===4){S.solved.push(gs[0]);S.sel=[];K.toast(C.long(PZ[S.i][gs[0]][0]));if(S.solved.length===4){S.done=true;S.win=true}}
  else{S.mist++;K.toast(top===3?'One away…':'Not a group.');$('tiles').classList.remove('shake');void $('tiles').offsetWidth;$('tiles').classList.add('shake');if(S.mist>=MIST){S.done=true;S.sel=[]}}
  save();if(S.done)end();render();
}
function end(){
  if(mode==='daily'){K.finish({win:S.win,score:S.win?MIST-S.mist:0,tries:S.hist.length,dist:S.win?S.mist:'X',best:B=>{if(S.win)B.max('clean',MIST-S.mist)}});setTimeout(K.openStats,1600)}
  else K.unlimited(S.win);
}
const grid=st=>st.hist.map(h=>h.g.map(g=>EM[g]).join('')).join('\n');
function shareText(){
  if(!K.todayDone())return '';const st=K.store.get(dayKeyS(),null)||S;
  return K.shareHead()+' '+(st.win?(st.mist+' mistake'+(st.mist===1?'':'s')):'X')+'\n'+grid(st)+'\n'+K.SITE;
}
function showResult(){
  $('res').innerHTML='<span class="lbl">'+(S.win?(S.mist?'Solved':'Perfect'):'Out of mistakes')+'</span><div class="big pop">'+(S.win?'All four links':S.solved.length+' of 4 links')+'</div><div class="sq">'+grid(S)+'</div>'+
   '<div class="row">'+(mode==='daily'?'<button class="cta" id="shareB" type="button">Share</button><button class="ghost" id="statsB" type="button">Stats</button><button class="ghost" id="unlB" type="button">Play unlimited</button>':'<button class="cta" id="nextB" type="button">New puzzle</button><button class="ghost" id="dailyB" type="button">Back to daily</button>')+'</div><p class="pmsg" id="shareMsg"></p>';
  if(mode==='daily'){$('shareB').onclick=()=>K.share(shareText(),$('shareMsg'));$('statsB').onclick=K.openStats;$('unlB').onclick=()=>setMode('unl')}
  else{$('nextB').onclick=()=>{K.store.del(SLUG+':unlcur');load()};$('dailyB').onclick=()=>setMode('daily')}
}
function setMode(m){mode=m;Array.prototype.forEach.call($('modes').children,b=>b.classList.toggle('on',b.getAttribute('data-m')===m));load();scrollTo(0,0)}
$('modes').addEventListener('click',e=>{const b=e.target.closest('button[data-m]');if(b&&b.getAttribute('data-m')!==mode)setMode(b.getAttribute('data-m'))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.done&&S.sel.length===4&&!document.querySelector('.modal:not([hidden])'))submit()});
load();
if(navigator.webdriver)window.__game={PZ,get S(){return S},submit,setMode,load,shareText,pick:names=>{S.sel=names.slice();render()}};
})();
</script>
<script src="/analytics/tracker.js" data-site="back-four" defer></script>
</body>
</html>
