(function () {

const Daily = {
  blank: () => ({ v: 1, days: {}, played: 0, wins: 0, streak: 0, maxStreak: 0, last: '', dist: {} }),
  load() {

  h('a', { class: 'pill', href: '/e63334287a3deaa3/daily/', id: 'back', text: '‹ Back' }),

const tilesHtml = (w, cls) => '<div class="tiles">' + Array.from(w).map((c, i) => '<span class="t ' + (typeof cls === 'function' ? cls(i) : cls || '') + '">' + c + '</span>').join('') + '</div>';

  '<div class="ex">' + tilesHtml('COIN', 'start') + tilesHtml('COIL', (i) => i === 3 ? 'ch' : '') + tilesHtml('COOL', (i) => i === 2 ? 'ch hit' : i === 1 ? 'hit' : '') + tilesHtml('COOP', (i) => i === 3 ? 'ch hit' : i === 1 || i === 2 ? 'hit' : '') + tilesHtml('POOP', 'goal') + '</div>' +

  modal('How to play', h('div', { html: HOW + '<p class="foot">A new start word every day at midnight, your time, the same for everyone. Unlimited games don\'t count towards your stats. · <a href="/privacy.html">Privacy</a></p>' }));
}
let cdTimer = 0;
function openStats(meKey) {
  const s = Daily.load(); let max = 1;
  DIST.forEach((d) => { max = Math.max(max, s.dist[d[0]] || 0); });
  const pct = s.played ? Math.round(100 * s.wins / s.played) : 0;
  const t = shareText();
  modal('Statistics', h('div', null, [
    h('div', { class: 'st4' }, [
      h('div', { html: '<b>' + s.played + '</b><small>Played</small>' }),
      h('div', { html: '<b>' + pct + '</b><small>Win %</small>' }),
      h('div', { html: '<b>' + s.streak + '</b><small>Current streak</small>' }),
      h('div', { html: '<b>' + s.maxStreak + '</b><small>Max streak</small>' })]),
    h('h3', { text: 'Moves compared to par' }),
    h('div', { class: 'dist' }, DIST.map((d) => {
      const n = s.dist[d[0]] || 0;
      return h('div', null, [h('span', { text: d[1] }), h('i', { class: d[0] === meKey ? 'me' : '', style: 'width:' + Math.max(8, Math.round(100 * n / max)) + '%', text: String(n) })]);
    })),
    h('h3', { text: 'Next puzzle in' }),
    h('div', { style: 'display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap' }, [
      h('span', { class: 'cd', id: 'cd', text: countdown() }),
      t ? h('button', { class: 'cta', text: 'Share', onclick: share }) : null])
  ]));
  clearInterval(cdTimer); cdTimer = setInterval(() => { const c = $('cd'); if (!c) { clearInterval(cdTimer); return; } c.textContent = countdown(); }, 1000);
}
$('helpBtn').addEventListener('click', openHelp);
$('statsBtn').addEventListener('click', () => openStats(st && st.mode === 'daily' && st.done ? (st.win ? distKey(st.moves - st.par) : 'X') : ''));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openModal) { e.preventDefault(); closeModal(); } }, true);

// ------------------------------------------------------------------ mode switch, actions, keyboard
const n0 = dayNum(today());
const bD = h('button', { type: 'button', text: n0 >= 1 ? 'Daily #' + n0 : 'Daily' }), bU = h('button', { type: 'button', text: 'Unlimited' });
const info = h('span', { class: 'info', id: 'info' });
$('modeRow').append(h('div', { class: 'seg', role: 'group', 'aria-label': 'Mode' }, [bD, bU]), info);
bD.onclick = () => start('daily'); bU.onclick = () => start('free');
const aUndo = h('button', { type: 'button', class: 'ghost', id: 'undoBtn', text: '↩ Undo', onclick: () => undo() });
const aHint = h('button', { type: 'button', class: 'ghost', id: 'hintBtn', text: '💡 Hint', onclick: () => hint() });
const aGive = h('button', { type: 'button', class: 'ghost', id: 'giveBtn', text: '🏳 Give up', onclick: () => giveUp() });
$('acts').append(aUndo, aHint, aGive);
const touch = (() => { try { return matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0); } catch (e) { return false; } })();
const kb = $('kb');
if (touch) {
  document.documentElement.classList.add('touch');
  kb.hidden = false;
  ['qwertyuiop', 'asdfghjkl', '↵zxcvbnm⌫'].forEach((row) => {
    const r = h('div');
    Array.from(row).forEach((ch) => {
      const b = h('button', { type: 'button', tabindex: '-1', text: ch === '↵' ? 'Enter' : ch, 'data-k': ch });
      if (ch === '↵' || ch === '⌫') b.className = 'w' + (ch === '↵' ? ' go' : '');
      b.addEventListener('pointerdown', (e) => e.preventDefault());
      b.addEventListener('click', () => key(ch === '↵' ? 'Enter' : ch === '⌫' ? 'Backspace' : ch));
      r.appendChild(b);
    });
    kb.appendChild(r);
  });
}

// ------------------------------------------------------------------ game state
// st: {mode, day, target, start, par, words (the ladder so far, start first), moves, log ('g' closer, 'y' no closer,
//      'r' further or a dead end, 'u' undo), hints, cue ({pos, word} for the current word), done, win, t0, t1, any}
let st = null, typed = '', giveArmed = 0, freeAny = !!store.get(SLUG + ':any', false);
const D = () => L.from(st.target).all;
function save() {
  if (!st) return;
  const o = { day: st.day, target: st.target, start: st.start, words: st.words, moves: st.moves, log: st.log, hints: st.hints, done: st.done, win: st.win, t0: st.t0, t1: st.t1, cue: st.cue };
  store.set(SLUG + ':' + (st.mode === 'daily' ? 'day' : 'free'), o);
}
function fresh(mode, start, target, day) {
  return { mode: mode, day: day || '', target: target, start: start, par: L.from(target).all[start], words: [start], moves: 0, log: [], hints: 0, cue: null, done: false, win: false, t0: 0, t1: 0 };
}
function restore(s, o) {
  if (!o || !Array.isArray(o.words) || o.words[0] !== s.start || o.target !== s.target) return s;
  const ok = o.words.every((w, i) => typeof w === 'string' && L.isWord(w) && (i === 0 || diffs(o.words[i - 1], w) === 1));
  if (!ok) return s;
  s.words = o.words.slice(); s.moves = Math.max(+o.moves || 0, s.words.length - 1); s.log = Array.isArray(o.log) ? o.log.filter((x) => /^[gyru]$/.test(x)) : [];
  s.hints = +o.hints || 0; s.done = !!o.done; s.win = !!o.win; s.t0 = +o.t0 || 0; s.t1 = +o.t1 || 0;
  s.cue = o.cue && typeof o.cue === 'object' && o.cue.at === s.words.length ? o.cue : null;
  return s;
}
function start(mode, newOne) {
  typed = ''; giveArmed = 0;
  if (mode === 'daily') {
    const day = today(), n = Math.max(1, dayNum(day));
    st = restore(fresh('daily', L.daily(n), L.TARGET, day), (() => { const o = store.get(SLUG + ':day', null); return o && o.day === day ? o : null; })());
  } else {
    const o = store.get(SLUG + ':free', null);
    if (!newOne && o && !o.done && typeof o.start === 'string' && typeof o.target === 'string' && L.isWord(o.start) && L.isWord(o.target) && L.from(o.target).all[o.start] != null) {
      st = restore(fresh('free', o.start, o.target), o);
    } else {
      const r = L.rng(Date.now() + ':' + Math.random()), last = st && st.mode === 'free' ? st.start : '';
      let p;
      if (freeAny) p = L.randomPair(r);
      else { const pool = L.dailyPool(); do { p = { target: L.TARGET, start: pool[Math.floor(r() * pool.length)] }; } while (p.start === last && pool.length > 1); }
      st = fresh('free', p.start, p.target);
    }
  }
  bD.classList.toggle('on', mode === 'daily'); bU.classList.toggle('on', mode === 'free');
  bD.setAttribute('aria-pressed', mode === 'daily'); bU.setAttribute('aria-pressed', mode === 'free');
  save(); render();
}
const cur = () => st.words[st.words.length - 1];
function diffs(a, b) { let n = 0; for (let i = 0; i < 4; i++) if (a[i] !== b[i]) n++; return n; }

// ------------------------------------------------------------------ moves
function key(k) {
  if (!st || st.done || openModal) return;
  if (k === 'Enter') { submit(); return; }
  if (k === 'Backspace') { typed = typed.slice(0, -1); renderLadder(); return; }
  if (/^[a-z]$/i.test(k) && typed.length < 4) { typed += k.toLowerCase(); renderLadder(); }
}
function bad(msg) {
  toast(msg);
  const r = document.querySelector('.rw.cur'); if (r) { r.classList.remove('bad'); void r.offsetWidth; r.classList.add('bad'); }
}
function submit() {
  const w = typed, c = cur();
  if (w.length < 4) { bad('Type a four-letter word'); return; }
  if (w === c) { bad('That\'s the word you\'re on: change one letter'); return; }
  if (!L.isWord(w)) { bad(UP(w) + ' isn\'t in the word list'); return; }
  const d = diffs(c, w);
  if (d !== 1) { bad('Change exactly one letter (that\'s ' + d + ')'); return; }
  if (st.words.indexOf(w) >= 0) { bad('You\'ve already used ' + UP(w)); return; }
  if (!st.t0) st.t0 = Date.now();
  const dist = D(), dc = dist[c], dw = dist[w];
  st.log.push(dw == null ? 'r' : dc == null || dw < dc ? 'g' : dw === dc ? 'y' : 'r');
  st.words.push(w); st.moves++; st.cue = null; typed = ''; giveArmed = 0;
  if (w === st.target) finish(true);
  else if (dw == null) toast('Careful: there\'s no way to ' + UP(st.target) + ' from ' + UP(w), 2400);
  save(); render(true);
}
function undo() {
  if (!st || st.done) return;
  if (st.words.length < 2) { toast('You\'re back at the start word'); return; }
  st.words.pop(); st.log.push('u'); st.cue = null; typed = ''; giveArmed = 0;
  save(); render();
}
function hint() {
  if (!st || st.done) return;
  const c = cur(), nx = L.next(c, st.target);
  if (!nx.length) { setHintLine('There\'s no way to ' + UP(st.target) + ' from ' + UP(c) + '. Undo to go back a step.'); return; }
  const best = nx[0];
  let pos = 0; for (let i = 0; i < 4; i++) if (c[i] !== best[i]) pos = i;
  if (!st.cue || st.cue.at !== st.words.length) {
    st.cue = { at: st.words.length, pos: pos, word: '' }; st.hints++;
  } else if (!st.cue.word) {
    st.cue.word = best; st.hints++; typed = best;
  } else { typed = st.cue.word; }
  if (!st.t0) st.t0 = Date.now();
  save(); render();
}
function giveUp() {
  if (!st || st.done) return;
  if (Date.now() - giveArmed > 3000) { giveArmed = Date.now(); aGive.textContent = 'Sure? Tap again'; aGive.classList.add('warn'); setTimeout(() => { if (giveArmed && Date.now() - giveArmed >= 2900) { giveArmed = 0; renderActs(); } }, 3000); return; }
  giveArmed = 0; finish(false); save(); render();
}
function finish(win) {
  st.done = true; st.win = win; st.t1 = Date.now(); st.cue = null; typed = '';
  if (st.mode === 'daily') {
    const over = st.moves - st.par;
    Daily.finish(st.day, { win: win, score: win ? over : null, tries: st.moves, time: st.t0 ? (st.t1 - st.t0) / 1000 : null, dist: win ? distKey(over) : 'X', perfect: win && over === 0 && !st.hints });
    setTimeout(() => { if (!openModal && st && st.done && st.mode === 'daily') openStats(win ? distKey(over) : 'X'); }, 1800);
  }
}
function shareText() {
  if (!st || !st.done) return null;
  const E = { g: '🟩', y: '🟨', r: '🟥', u: '↩️' };
  let grid = st.log.map((x) => E[x]).join('');
  if (st.win) grid = grid.replace(/🟩$/, '💩');
  else grid += '🏳️';
  const head = NAME + (st.mode === 'free' ? ' (unlimited)' : dayNum(st.day) >= 1 ? ' #' + dayNum(st.day) : ' (preview)');
  const line = st.win ? '💩 in ' + st.moves + ' · par ' + st.par : 'gave up · par ' + st.par;
  return head + ' ' + line + (st.hints ? ' 💡' + st.hints : '') + '\n' + grid + '\nascoding11.github.io';
}
function share() { const t = shareText(); if (!t) return; copyText(t).then((ok) => toast(ok ? 'Copied! Paste it anywhere.' : 'Couldn\'t copy, sorry')); }

// ------------------------------------------------------------------ drawing
function setHintLine(t) { $('hintLine').textContent = t || ''; }
function row(word, opt) {
  opt = opt || {};
  const r = h('div', { class: 'rw' + (opt.cls ? ' ' + opt.cls : '') });
  r.appendChild(h('span', { class: 'lab', text: opt.lab || '' }));
  const tl = h('div', { class: 'tiles' });
  for (let i = 0; i < 4; i++) {
    const ch = word[i] || '';
    tl.appendChild(h('span', { class: 't ' + (opt.tile ? opt.tile(i, ch) : ''), text: UP(ch) }));
  }
  r.appendChild(tl);
  r.appendChild(h('span', { class: 'side', text: opt.side || '' }));
  r.setAttribute('aria-label', (opt.lab ? opt.lab + ': ' : '') + (word ? UP(word).split('').join(' ') : 'empty'));
  return r;
}
function renderLadder(animate) {
  const lad = $('ladder'); lad.innerHTML = '';
  const T = st.target, ws = st.words;
  ws.forEach((w, i) => {
    const prev = ws[i - 1];
    lad.appendChild(row(w, {
      lab: i === 0 ? 'Start' : String(i), cls: animate && i === ws.length - 1 && i > 0 ? 'new' : '',
      tile: (k, ch) => (i === 0 ? 'start' : (w === T ? 'goal' : (prev && prev[k] !== ch ? 'ch' : '') + (ch === T[k] ? ' hit' : '')))
    }));
  });
  if (!st.done) {
    const c = cur();
    const r = row(typed.padEnd(4, ' ').slice(0, 4).replace(/ /g, ''), {
      cls: 'cur', lab: String(ws.length),
      tile: (k, ch) => (ch ? 'typed' + (ch !== c[k] ? ' diff' : '') : 'ghost') + (st.cue && st.cue.pos === k ? ' cue' : '')
    });
    // empty slots show the current word's letter faintly, so you can see what you're changing
    r.querySelectorAll('.t').forEach((t, k) => { if (!typed[k]) t.textContent = UP(c[k]); });
    lad.appendChild(r);
    if (!touch) lad.appendChild(h('div', { class: 'tip', text: 'Type a word and press Enter' }));
    lad.appendChild(h('div', { class: 'rw gap', 'aria-hidden': 'true' }, [h('span', { class: 'lab' }), h('span', { text: '⋮' })]));
    lad.appendChild(row(T, { lab: 'Goal', tile: () => 'goal', side: T === 'poop' ? '💩' : '' }));
  } else if (!st.win) {
    lad.appendChild(h('div', { class: 'rw gap', 'aria-hidden': 'true' }, [h('span', { class: 'lab' }), h('span', { text: '⋮' })]));
    lad.appendChild(row(T, { lab: 'Goal', tile: () => 'goal', side: T === 'poop' ? '💩' : '' }));
  } else lad.lastChild.classList.add('win');
  const stage = $('stage');
  requestAnimationFrame(() => { const c = lad.querySelector('.rw.cur') || lad.lastChild; if (c && c.scrollIntoView) try { c.scrollIntoView({ block: 'nearest' }); } catch (e) {} if (st.done && !st.win) stage.scrollTop = stage.scrollHeight; });
}
function renderActs() {
  aUndo.disabled = st.done || st.words.length < 2;
  aHint.disabled = st.done;
  aGive.textContent = giveArmed ? 'Sure? Tap again' : '🏳 Give up'; aGive.classList.toggle('warn', !!giveArmed);
  $('acts').hidden = st.done;
}
function render(animate) {
  if (!st) return;
  info.innerHTML = 'Moves <b>' + st.moves + '</b> · Par <b>' + st.par + '</b>';
  renderLadder(animate);
  renderActs();
  if (st.done) setHintLine('');
  else if (st.cue && st.cue.at === st.words.length) setHintLine(st.cue.word ? 'Try ' + UP(st.cue.word) + ', then press Enter.' : 'Change letter ' + (st.cue.pos + 1) + ' (the ' + UP(cur()[st.cue.pos]) + ').');
  else setHintLine('');
  kb.hidden = !touch || st.done;
  const end = $('endBox'); end.hidden = !st.done; end.innerHTML = '';
  if (st.done) {
    end.className = 'end';
    const over = st.moves - st.par;
    const p = L.path(st.start, st.target) || [];
    const title = st.win ? (over === 0 ? (st.target === 'poop' ? 'Par! Perfectly pooped 💩' : 'Par! Perfect ladder') : over === 1 ? 'Made it, one over par' : 'Made it, ' + over + ' over par') : 'Better luck tomorrow';
    end.append(
      h('h2', { class: st.win ? 'win' : 'lose', text: st.mode === 'free' && !st.win ? 'Here\'s a way' : title }),
      h('p', { html: st.win ? 'You reached <b>' + UP(st.target) + '</b> in <b>' + st.moves + '</b> move' + (st.moves === 1 ? '' : 's') + ' (par ' + st.par + ')' + (st.hints ? ' with ' + st.hints + ' hint' + (st.hints > 1 ? 's' : '') : '') + '.' : 'A shortest ladder from ' + UP(st.start) + ' has ' + st.par + ' steps:' }),
      h('p', { html: (st.win ? 'A shortest ladder: ' : '') + '<b>' + p.map(UP).join(' → ') + '</b>' }),
      h('div', { class: 'row' }, [
        h('button', { type: 'button', class: 'cta', text: 'Share', onclick: share }),
        h('button', { type: 'button', class: 'ghost', text: st.mode === 'daily' ? 'Play unlimited' : 'Next word', onclick: () => start('free', true) }),
        st.mode === 'daily' ? h('span', { class: 'next', id: 'nextIn', text: 'Next in ' + countdown() }) : null]));
  }
  if (st.mode === 'free' && !st.done) {
    // Unlimited: choose the goal (POOP or any word), and skip to a new start word
    const anyBtn = h('button', { type: 'button', class: 'ghost', text: freeAny ? 'Goal: any word' : 'Goal: POOP', title: 'Switch between POOP and a random goal word', onclick: () => { freeAny = !freeAny; store.set(SLUG + ':any', freeAny); start('free', true); } });
    const skip = h('button', { type: 'button', class: 'ghost', text: 'New word', onclick: () => start('free', true) });
    end.className = ''; end.hidden = false; end.append(h('div', { class: 'acts' }, [anyBtn, skip]));
  }
}

// ------------------------------------------------------------------ keyboard
document.addEventListener('keydown', (e) => {
  if (openModal || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') {
    // Enter submits whatever is typed; with nothing typed it presses a focused button, but never Give up (that needs a second click or tap)
    const btn = e.target && e.target.closest && e.target.closest('button');
    if (btn && !typed && btn !== aGive) return;
    e.preventDefault(); key('Enter'); return;
  }
  if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); key(e.key); }
  else if (e.key === 'Escape' && typed) { typed = ''; renderLadder(); }
});
// a button clicked with the mouse doesn't keep the focus, so typing and Enter go back to the ladder
document.addEventListener('click', (e) => { const b = e.detail && e.target && e.target.closest && e.target.closest('button'); if (b) b.blur(); });
setInterval(() => {
  const e = $('nextIn'); if (e) e.textContent = 'Next in ' + countdown();
  if (st && st.mode === 'daily' && st.day !== today() && !typed) start('daily');
}, 1000);

Daily.load(); // clears a streak that ended before yesterday
start('daily');
if (!store.get(SLUG + ':seen', 0)) setTimeout(openHelp, 250);
if (navigator.webdriver) window.__pd = {
  get st() { return st; }, L: L, key: key, type(w) { typed = ''; Array.from(w).forEach(key); key('Enter'); }, undo: undo, hint: hint,
  giveUp() { giveArmed = Date.now() - 100; giveUp(); }, start: start, shareText: shareText, Daily: Daily,
  setToday(k) { DAY_TEST = /^\d{8}$/.test(k) ? k : ''; }
};
})();
</script>
